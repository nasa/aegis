[project]
name = "lgrs-reference"
version = "0.1.0"
description = "Generates the lgrs reference corpus used by the AEGIS TypeScript LGRS tests."
requires-python = ">=3.13"
dependencies = ["lgrs==0.4.0"]

[project.scripts]
generate = "lgrs_reference.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lgrs_reference"]
