# Standalone local demo: docker compose --env-file .env.public -f docker-compose.public.yml up --build -d
name: aegis-public
services:
  nginx:
    image: aegis-public-nginx:latest
    build:
      context: .
      dockerfile: docker/public/Dockerfile
      target: nginx
    restart: unless-stopped
    depends_on:
      apiv1:
        condition: service_healthy
      mock-auth:
        condition: service_healthy
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:${PUBLIC_PORT:-8443}:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    volumes:
      - public-tls:/etc/nginx/certs
      - ${STATIC_DIR:-../aegis_static}:/usr/share/nginx/html/static:ro
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  apiv1:
    image: aegis-public-apiv1:latest
    build:
      context: .
      dockerfile: docker/public/Dockerfile
      target: api
    restart: unless-stopped
    env_file: .env.template
    environment:
      MOCK_USER: "false"
      DB_HOST: database
      DB_PASS: ${PUBLIC_DB_PASSWORD:?Set PUBLIC_DB_PASSWORD}
      STATIC_DIR: /static
      EMSS_TOKEN: ${PUBLIC_EMSS_TOKEN:?Set PUBLIC_EMSS_TOKEN}
      PUBLIC_DEMO_SEED: ${PUBLIC_DEMO_SEED:-true}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ${STATIC_DIR:-../aegis_static}:/static
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4001/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      start_period: 45s
      retries: 20

  database:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegis
      POSTGRES_PASSWORD: ${PUBLIC_DB_PASSWORD:?Set PUBLIC_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - public-database:/var/lib/postgresql/data

  mock-auth:
    image: aegis-public-mock-auth:latest
    build:
      context: .
      dockerfile: docker/public/Dockerfile
      target: mock-auth
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost:8443}
      PUBLIC_COOKIE_SECRET: ${PUBLIC_COOKIE_SECRET:?Set PUBLIC_COOKIE_SECRET}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4180/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  public-tls:
  public-database:
