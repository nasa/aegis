.db-export-template:
  needs: []
  # I don't think we want to do this, because I don't think we want GitLab to consider this a
  # deployment. It's just grabbing some data off of Production.
  # environment:
  #   name: production
  #   url: https://aegis.fit.nasa.gov
  when: manual
  stage: stageless
  timeout: 10 minutes
  variables:
    GIT_STRATEGY: none
  script:
    # init sudo ability
    - echo "${DEPLOY_SUDO_PASS}" | sudo -S touch /tmp/somefile
    - PROJECT_DIR=$(pwd)
    - cd /opt/aegis
    - sudo docker compose exec database pg_dump -U postgres aegis > "${PROJECT_DIR}/aegis.sql"
  artifacts:
    paths:
      - aegis.sql
    expire_in: 1 day

z:db-export:prod:
  extends: .db-export-template
  when: always
  tags: ["emss-aegis-prod"]
  variables:
    DEPLOY_SUDO_PASS: $DEPLOY_SUDO_PASS_PROD #CI/CD Variable

z:db-export:int:
  extends: .db-export-template
  tags: ["emss-aegis-int"]
  variables:
    DEPLOY_SUDO_PASS: $DEPLOY_SUDO_PASS_INT #CI/CD Variable

z:db-export:carbon:
  extends:
    - .db-export-template
    - .carbon-access

z:db-export:gold:
  extends:
    - .db-export-template
    - .gold-access

z:db-export:iron:
  extends:
    - .db-export-template
    - .iron-access

z:db-export:neon:
  extends:
    - .db-export-template
    - .neon-access

z:db-export:oxygen:
  extends:
    - .db-export-template
    - .oxygen-access

.db-import-template:
  when: manual
  stage: stageless
  timeout: 10 minutes
  variables:
    GIT_STRATEGY: none
  script:
    # init sudo ability
    - echo "${DEPLOY_SUDO_PASS}" | sudo -S touch /tmp/somefile
    - PROJECT_DIR=$(pwd)
    - cd /opt/aegis
    - cp "${PROJECT_DIR}/aegis.sql" /d1/aegis/db-init/aegis.sql

    # Stop docker compose, then remove database files
    - sudo /usr/bin/docker compose down --remove-orphans
    - sudo rm -rf /d1/aegis/postgres

    # Bring docker compose back up, which will use the file at /d1/aegis/db-init/aegis.sql, then remove it
    - sudo /usr/bin/docker compose up -d
    - sudo rm -f /d1/aegis/db-init/aegis.sql

    # Migrations will be run when the apiv1 container restarts

z:db-import:carbon:
  extends:
    - .db-import-template
    - .carbon-deploy
  needs: ["z:db-export:prod"]

z:db-import:gold:
  extends:
    - .db-import-template
    - .gold-deploy
  needs: ["z:db-export:prod"]

z:db-import:iron:
  extends:
    - .db-import-template
    - .iron-deploy
  needs: ["z:db-export:prod"]

z:db-import:neon:
  extends:
    - .db-import-template
    - .neon-deploy
  needs: ["z:db-export:prod"]

z:db-import:oxygen:
  extends:
    - .db-import-template
    - .oxygen-deploy
  needs: ["z:db-export:prod"]

z:db-import:int:
  extends: .db-import-template
  tags: ["emss-aegis-int"]
  needs: ["z:db-export:prod"]
  environment:
    name: integration
    url: $URL
  variables:
    DEPLOY_SUDO_PASS: $DEPLOY_SUDO_PASS_INT #CI/CD Variable
    URL: https://aegis-int.fit.nasa.gov

.container-logs-template:
  when: manual
  needs: []
  stage: stageless
  timeout: 10 minutes
  variables:
    GIT_STRATEGY: none
  script:
    - echo "${DEPLOY_SUDO_PASS}" | sudo -S touch /tmp/somefile

    # OS info and partition usage
    - cat /etc/os-release
    - df -h

    # Setup artifact directories
    - LOG_ARTIFACTS=$(pwd)/log_artifacts
    - mkdir -p "${LOG_ARTIFACTS}"

    - cd /opt/aegis

    # print last 100 lines to job output
    - sudo docker compose logs nginx --tail 100
    - sudo docker compose logs database --tail 100
    - sudo docker compose logs gdal --tail 100
    - sudo docker compose logs apiv1 --tail 100
    - sudo journalctl --unit=rsyslog -n 200 --no-pager

    # Put the full logs into artifacts. Full logs may hit the job log length
    # limit, and generally make the job log unreadably long
    - sudo docker compose logs nginx > "${LOG_ARTIFACTS}/nginx"
    - sudo docker compose logs database > "${LOG_ARTIFACTS}/database"
    - sudo docker compose logs gdal > "${LOG_ARTIFACTS}/gdal"
    - sudo docker compose logs apiv1 > "${LOG_ARTIFACTS}/apiv1"
    - sudo journalctl --unit=rsyslog --no-pager > "${LOG_ARTIFACTS}/host-rsyslog"

  artifacts:
    when: always
    paths:
      - ./log_artifacts
    expire_in: 1 day

z:logs:carbon:
  extends:
    - .container-logs-template
    - .carbon-access

z:logs:gold:
  extends:
    - .container-logs-template
    - .gold-access

z:logs:iron:
  extends:
    - .container-logs-template
    - .iron-access

z:logs:neon:
  extends:
    - .container-logs-template
    - .neon-access

z:logs:oxygen:
  extends:
    - .container-logs-template
    - .oxygen-access

z:logs:int:
  extends: .container-logs-template
  tags: ["emss-aegis-int"]
  variables:
    DEPLOY_SUDO_PASS: $DEPLOY_SUDO_PASS_INT #CI/CD Variable

z:logs:prod:
  extends: .container-logs-template
  tags: ["emss-aegis-prod"]
  variables:
    DEPLOY_SUDO_PASS: $DEPLOY_SUDO_PASS_PROD #CI/CD Variable
