.db-import-template:
  when: manual
  stage: stageless
  timeout: 10 minutes
  variables:
    GIT_STRATEGY: none
  script:
    # init sudo ability
    - echo "${DEPLOY_SUDO_PASS}" | sudo -S touch /tmp/somefile
    - PROJECT_DIR=$(pwd)
    - cd /opt/aegis
    - cp "${PROJECT_DIR}/aegis.sql" /d1/aegis/db-init/aegis.sql

    # Stop docker compose, then remove database files
    - sudo /usr/bin/docker compose down --remove-orphans
    - sudo rm -rf /d1/aegis/postgres

    # Bring docker compose back up, which will use the file at /d1/aegis/db-init/aegis.sql, then remove it
    - sudo /usr/bin/docker compose up -d
    - sudo rm -f /d1/aegis/db-init/aegis.sql

    # Migrations will be run when the apiv1 container restarts

z:db-import:carbon:
  extends:
    - .db-import-template
    - .carbon-deploy
  needs: ["z:db-export:prod"]

