    - .deploy-template:dev
    - .neon-deploy
  when: manual
  before_script:
    # This is currently our hack to change out a necessary var for Launchpad Auth
    - sed -i "s/INSERT_SUBDOMAIN/neon-emss-dev/g" .env
    - sed -i "s/INSERT_LOG_DATA_SERVER_NAME/neon/g" .env

deploy:oxygen:
  extends:
    - .deploy-template:dev
    - .oxygen-deploy
  when: manual
  before_script:
    # This is currently our hack to change out a necessary var for Launchpad Auth
    - sed -i "s/INSERT_SUBDOMAIN/oxygen-emss-dev/g" .env
    - sed -i "s/INSERT_LOG_DATA_SERVER_NAME/oxygen/g" .env

deploy:int:
  extends: .deploy-template
  tags: ["emss-aegis-int"]
  resource_group: int # prevents concurrent executions on this environment when there are multiple pipelines
  environment:
    name: integration
    url: ${URL}
  needs:
    - make-dotenv:prod
    - docker:retag
    - deploy:artifactize-committed-files
  variables:
    DEPLOY_SUDO_PASS: ${DEPLOY_SUDO_PASS_INT} #CI/CD Variable
    URL: https://aegis-int.fit.nasa.gov
  only:
    - int
  before_script:
    - chmod +x ./scripts/upgrade-db.sh
    - ./scripts/upgrade-db.sh
    - sed -i "s/INSERT_SUBDOMAIN/aegis-int/g" .env
    - sed -i "s/INSERT_LOG_DATA_SERVER_NAME/int/g" .env

