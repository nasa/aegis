variables:
  # Images are pulled via GitLab dependency proxy (caches from Docker Hub)
  # Kaniko uses the dependency proxy as a registry mirror for rate limiting and caching
  KANIKO_REGISTRY_MIRROR: "${CI_SERVER_HOST}/emss/dependency_proxy/containers"

# Default node image unless otherwise specified
image: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:24.11.1-alpine3.23"

include:
  # A11y tests. Disabled for now.
  # - template: "Verify/Accessibility.gitlab-ci.yml"

  - project: "emss/gitlab-templates"
    ref: 2.7.1
    file:
      # Run standard FIT developer-ecosystem/ci-job-templates with emss
      # stageless overrides.
      # <https://gitlab.fit.nasa.gov/developer-ecosystem/ci-job-templates>
      - "/jobs/fit-ecosystem.gitlab-ci.yml"

      # Code quality checks
      - "/jobs/code-quality.gitlab-ci.yml"

      # Fitdock deploy template
      - "/jobs/fitdock-deploy.gitlab-ci.yml"

      # Kaniko build template
      - "/jobs/kaniko-build.gitlab-ci.yml"

      # Retag job template
      - "/jobs/container-retag.gitlab-ci.yml"

  # Adds jobs to export/import db, dump logs, and load tests on servers
  - local: .gitlab/includes/server-jobs.yml
  - local: .gitlab/includes/load-test.yml

# Override FIT template jobs to require manual trigger
# (eegitlabregistry images are inaccessible; these are slow/noisy on every commit)
yaml-lint:
  stage: stageless
  when: manual

code_quality:
  when: manual

project-check:
  when: manual
  variables:
    SCAN_FOR_DOCS: "no"
    ALLOWED_FILES: >
      src/packages
      src/tests/vitest/fixtures/static/testZip.zip

dependency-check:
  stage: stageless
  when: manual
  tags: ["openshift"]
  needs: ["install_dependencies"]
  before_script:
    # node_modules is shipped as a tarball artifact (see install_dependencies)
    - tar -xf node_modules.tar

npm-audit:
  stage: stageless
  image: ${CI_REGISTRY}/emss/docker-images/node-ci:npm-audit # custom image, not on Docker Hub
  when: manual
  needs: []
  tags: ["openshift"]
  allow_failure: true
  script:
    # Run this without --json to make a pretty-print for the job log, plus will pass/fail the job
    - npm audit

install_dependencies:
  stage: stageless
  tags: ["openshift"]
  script:
    - npm ci
    # Tar node_modules into a single artifact. GitLab spends most of the upload time walking 50k+ files
    # and adding each to the artifact zip; collapsing to one tarball cuts upload from ~22s to a few seconds,
    # and dependent jobs see the same speedup on download/extract.
    - tar -cf node_modules.tar node_modules
  artifacts:
    expire_in: 1 day
    paths:
      - node_modules.tar

#
# Creates Software Bill of Materials
#
node-sbom:
  stage: stageless
  tags: ["openshift"]
  needs: ["install_dependencies"]
  image: ${CI_REGISTRY}/emss/docker-images/node-ci:sbom # custom image, not on Docker Hub
  before_script:
    # node_modules is shipped as a tarball artifact (see install_dependencies)
    - tar -xf node_modules.tar
  script:
    - /make-sbom.sh
  artifacts:
    when: always
    paths:
      - "./bom.json"
      - "./BOM.md"
    expire_in: 1 day

# Template for `test` and `test-node-next` jobs, adding database service, etc.
.test_template:
  stage: stageless
  needs:
    - install_dependencies
    - make-dotenv:test
    - z:db-export:prod
  variables:
    # define variables used by Node app
    DB_HOST: postgres-test-container
    DB_PASS: test-only-password
    DB_NAME: aegis

    # plug those same variables into the Postgres container we're spinning up
    POSTGRES_PASSWORD: test-only-password
    POSTGRES_DB: aegis
  services:
    # DOCKER_IMAGE_DATABASE comes from make-test-dotenv job artifact
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/${DOCKER_IMAGE_DATABASE}
      alias: postgres-test-container
      variables:
        # OpenShift runs containers as a random non-root UID. The default
        # PGDATA (/var/lib/postgresql/data) is owned by the postgres user
        # (UID 70 on alpine) and not writable by an arbitrary UID, so initdb
        # fails silently and postgres never starts. Redirecting PGDATA to
        # /tmp lets initdb create the data directory regardless of UID.
        PGDATA: /tmp/pgdata
  tags: ["openshift"]
  before_script:
    # node_modules is shipped as a tarball artifact (see install_dependencies)
    - tar -xf node_modules.tar
    # Remove lines from .env file. See "Variable Precedence" section above
    - sed -i '/DB_PASS/d' .env
    - sed -i '/DB_HOST/d' .env
    - sed -i '/DB_NAME/d' .env
    # OpenShift runners can't write to /d1; redirect file uploads to /tmp.
    - sed -i 's|^STATIC_DIR=.*|STATIC_DIR=/tmp/aegis-static|' .env
    - mkdir -p /tmp/aegis-static

.lint-tsc-template:
  stage: stageless
  tags: ["openshift"]
  needs:
    - install_dependencies
  before_script:
    - tar -xf node_modules.tar

lint-js:
  extends: .lint-tsc-template
  script:
    - npm run lint:js

lint-css:
  extends: .lint-tsc-template
  script:
    - npm run lint:css

tsc:
  extends: .lint-tsc-template
  script:
    # schema:create generates the typescript-json-schema outputs that some
    # types reference; tsc fails without them.
    - npm run schema:create
    - npm run tsc

# Sharded vitest. Each shard emits a blob report (coverage data embedded);
# merge-vitest-coverage consolidates them into the final cobertura/lcov/junit.
# Per-shard cobertura would only reflect 1/N of the codebase and confuse
# GitLab's coverage UI.
test-vitest:
  parallel:
    matrix:
      - SHARD_INDEX: 1
      - SHARD_INDEX: 2
      - SHARD_INDEX: 3
  variables:
    NUM_SHARDS: 3
  extends: .test_template
  script:
    - echo "Running vitest shard ${SHARD_INDEX} of ${NUM_SHARDS}"
    - node .gitlab/scripts/load-sql-dump.mjs aegis.sql
    - npm run migration:up
    - npm run schema:create
    - npx vitest run
      --config src/tests/vitest/vitest.config.mts
      --coverage
      --reporter=blob
      --shard=${SHARD_INDEX}/${NUM_SHARDS}
  artifacts:
    paths:
      - .vitest-reports/
    expire_in: 1 day

# Merge sharded vitest blob reports into a single coverage + junit set.
# `vitest --merge-reports` reads .vitest-reports/ from all shard artifacts,
# replays the embedded coverage/test data, and emits whatever reporters we
# pass. No DB needed — this step does not run tests.
merge-vitest-coverage:
  stage: stageless
  tags: ["openshift"]
  needs:
    - install_dependencies
    - test-vitest
    - test-vitest:browser
  before_script:
    - tar -xf node_modules.tar
  script:
    - npx vitest --merge-reports
      --config src/tests/vitest/vitest.config.mts
      --reporter=junit
      --coverage
      --coverage.reporter=text
      --coverage.reporter=text-summary
      --coverage.reporter=cobertura
      --coverage.reporter=lcov
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: ./coverage/cobertura-coverage.xml
      junit:
        - junit.xml
    paths:
      - ./coverage/*
    expire_in: 1 day

test-node-next:
  extends: .test_template
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:25.8.1-alpine
  when: manual
  allow_failure: true
  script:
    - node .gitlab/scripts/load-sql-dump.mjs aegis.sql
    - npm run migration:up
    - npm run schema:create
    - npm run lint
    - npm run tsc
    - npm run build
    - npm run test:vitest

test-playwright:
  parallel:
    matrix:
      - SHARD_INDEX: 1
      - SHARD_INDEX: 2
      - SHARD_INDEX: 3
      - SHARD_INDEX: 4
  variables:
    NUM_SHARDS: 4
  extends: .test_template
  stage: stageless
  image: mcr.microsoft.com/playwright:v1.61.0-jammy
  needs:
    - install_dependencies
    - make-dotenv:test
    - z:db-export:prod
  script:
    - echo "Running shard ${SHARD_INDEX} of ${NUM_SHARDS}"
    - mkdir -p playwright-report
    - node .gitlab/scripts/load-sql-dump.mjs aegis.sql

    - npm run api:build # Build api in advance so it also builds the automerge:migration
    - npm run migration:up
    - npm run automerge:migration

    # node_modules artifact was built on Alpine (musl); this image is Ubuntu (glibc).
    # npm skips libc-mismatched optional deps, so install the glibc rollup binary explicitly.
    - npm install --no-save @rollup/rollup-linux-x64-gnu

    # Run Playwright tests
    - npm run test:playwright:ci
  timeout: 30 minutes
  artifacts:
    when: always
    paths:
      - playwright-report/ # Store Playwright test reports
    expire_in: 1 day

test-vitest:browser:
  stage: stageless
  image: mcr.microsoft.com/playwright:v1.61.0-jammy
  needs:
    - install_dependencies
  tags: ["openshift"]
  before_script:
    # node_modules is shipped as a tarball artifact (see install_dependencies)
    - tar -xf node_modules.tar
    # node_modules artifact was built on Alpine (musl); this image is Ubuntu (glibc).
    # npm skips libc-mismatched optional deps, so install the glibc rollup binary explicitly.
    - npm install --no-save @rollup/rollup-linux-x64-gnu
  script:
    # schema:create generates typescript-json-schema outputs some modules import.
    - npm run schema:create
    # Emit a coverage blob (like the sharded test-vitest jobs) so
    # merge-vitest-coverage folds browser-mode coverage into the single
    # cobertura/lcov report. Explicit blob name avoids colliding with the
    # node shards' auto-named blobs when both artifacts extract into the merge.
    - npx vitest run
      --config src/tests/vitest-browser/vitest.config.mts
      --coverage
      --reporter=blob
      --outputFile=.vitest-reports/blob-browser.json
  timeout: 20 minutes
  artifacts:
    paths:
      - .vitest-reports/
    expire_in: 1 day

# Test the automerge migrations against a prod database
# This job will run "npm run test:automerge:migration" which will generate the schema, build and run the migration
# The migration file performs it's own checks against the schema
# The migration file is executed twice and the results are compared to make sure it's repeatable
test-automerge-migrate:
  extends: .test_template
  script:
    # install the database and load it with prod data to get current automerge doc data
    - node .gitlab/scripts/load-sql-dump.mjs aegis.sql
    - npm run migration:up

    # generate a schema, build the migration file, run it, and validate against the schema
    - echo "Running migration (1)"
    - npm run test:automerge:migration
    # get a snapshot of the automerge_native_db table
    - node .gitlab/scripts/dump-table.mjs automerge_native_db automerge_native_db_migrate1.txt

    # run the migration a 2nd time. This should not change the output
    - echo "Running migration (2)"
    - npm run test:automerge:migration
    # get a snapshot of the automerge_native_db table
    - node .gitlab/scripts/dump-table.mjs automerge_native_db automerge_native_db_migrate2.txt

    # compare snapshots; fail if they differ
    - echo "Comparing snapshots"
    - diff automerge_native_db_migrate1.txt automerge_native_db_migrate2.txt || exit 1
  artifacts:
    when: always
    paths:
      - automerge_native_db_migrate1.txt
      - automerge_native_db_migrate2.txt
    expire_in: 1 day

# Run the FK integrity check against the prod database on demand.
# Produces a JSON report as a downloadable artifact for offline review.
# Depends on the prod DB export so it always runs against real production data.
test-automerge-integrity:
  extends: .test_template
  when: manual
  needs:
    - install_dependencies
    - make-dotenv:test
    - z:db-export:prod
  script:
    # Load prod data and bring the schema up to date
    - node .gitlab/scripts/load-sql-dump.mjs aegis.sql
    - npm run migration:up

    # Run the full migration first so all entity data is in Automerge docs,
    # then run the standalone integrity check against those docs.
    - npm run test:automerge:migration
    - npm run test:automerge:integrity
  artifacts:
    when: always
    paths:
      - .local/integrity-report-*.json
    expire_in: 7 days

.make-dotenv-template:
  stage: stageless
  needs: []
  tags: ["openshift"]
  before_script:
    # Determine the version of @emss/make-dotenv defined in package-lock.json
    # This allows us to be sure the same version is used in CI as is used in local dev
    - MAKE_DOTENV_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@emss/make-dotenv'].version")

    # OpenShift runs the container as a random non-root UID, which can't write
    # the default global npm prefix (/usr/local/lib/node_modules). Redirect to
    # /tmp and put its bin on PATH so `make-dotenv` resolves below.
    - export NPM_CONFIG_PREFIX=/tmp/npm-global
    - export PATH=/tmp/npm-global/bin:$PATH

    # Globally install these packages. This allows us to use them without installing
    # all packages specified in package.json, which takes 1-4 minutes depending on the
    # repository.
    #
    # Other options:
    #   1. We could make this job have `needs: ['install_dependencies']`, but that means
    #      this job would be delayed running 1-4 minutes, which then delays container
    #      builds 1-4 minutes.
    #   2. We could have the emss/packages build a make-dotenv docker image tagged by its
    #      version number, and then this job could run using that image by specifying
    #      `image: $CI_REGISTRY/emss/packages/make-dotenv:x.y.z`. That would save some
    #      time since we wouldn't need to install global packages each time, but the job
    #      as-written runs in about 10 seconds, so we wouldn't be saving much. We would
    #      be causing ourselves some problems, though, since we'd have a version of
    #      @emss/make-dotenv specified in package(-lock).json, and then we'd have another
    #      version specified on the docker image on this job. We'd have to be careful to
    #      keep the two in sync. The current job as-written seems simpler and good enough.
    - npm i -g "@emss/make-dotenv@${MAKE_DOTENV_VERSION}" --userconfig ./.npmrc
  script:
    # Copy contents of DOTENV_SECRET from CI/CD variables to a new .env.secret file
    - echo "${DOTENV_SECRET_TS}" > ./env.secret.ts

    # Determine which docker image type (dev, int, or prod) to deploy based on branch
    # Append the commit sha in order to ensure the correct build is being deployed in the case
    # multiple devs are building images simultaneously
    - >
      if [ "${CI_COMMIT_REF_SLUG}" == "prod" ]; then
          IMAGE_VERSION="prod-${CI_COMMIT_SHORT_SHA}"
      elif [ "${CI_COMMIT_REF_SLUG}" == "int" ]; then
          IMAGE_VERSION="int-${CI_COMMIT_SHORT_SHA}"
      else
          IMAGE_VERSION="dev-${CI_COMMIT_SHORT_SHA}"
      fi

    # Export the variable so it can be read inside the make-dotenv package
    # Save image version into an artifact to be read later in other job scripts
    - export IMAGE_VERSION
    - echo "IMAGE_VERSION=${IMAGE_VERSION}" >> pipelineVariables.env

    # Run make-dotenv to generate the .env file
    - make-dotenv "${MAKEDOTENV_ENV}"

    # After we have the .env file, extract DOCKER_IMAGE_DATABASE from .env and export it without quotes
    - source .env
    - echo "DOCKER_IMAGE_DATABASE=${DOCKER_IMAGE_DATABASE//\"/}" >> pipelineVariables.env
  artifacts:
    reports:
      dotenv: pipelineVariables.env
    paths:
      - .env
    expire_in: 1 day

make-dotenv:fit:
  extends: .make-dotenv-template
  variables:
    MAKEDOTENV_ENV: "fit"

make-dotenv:prod:
  extends: .make-dotenv-template
  variables:
    MAKEDOTENV_ENV: "prod"

make-dotenv:test:
  extends: .make-dotenv-template
  variables:
    MAKEDOTENV_ENV: "test"

#
# Build container images
# Vite is not used in production, so we don't need to build it
#

# This build template uses a hard coded pattern path to find the Dockerfile for each service
.kaniko-build-template:
  extends: .emss-kaniko-build
  stage: stageless
  # Can't move to openshift: the FIT .emss-kaniko-build script writes
  # /kaniko/.docker/config.json, and /kaniko/ is owned by root in the kaniko
  # image — openshift's random non-root UID can't create files there.
  tags: ["docker", "linux"]
  needs:
    - make-dotenv:fit

docker:build:nginx:
  extends: .kaniko-build-template
  variables:
    SERVICE_NAME: nginx
    MULTISTAGE_TARGET: prod
    GIT_COMMIT: ${CI_COMMIT_SHORT_SHA}
    MAP_ENV_VARS_TO_BUILD_ARGS: |
      GIT_COMMIT

docker:build:gdal:
  extends: .kaniko-build-template
  variables:
    SERVICE_NAME: gdal
    MULTISTAGE_TARGET: base

docker:build:apiv1:
  extends: .kaniko-build-template
  variables:
    SERVICE_NAME: apiv1
    MULTISTAGE_TARGET: prod
    GIT_COMMIT: ${CI_COMMIT_SHORT_SHA}
    MAP_ENV_VARS_TO_BUILD_ARGS: |
      GIT_COMMIT

#
# Retag docker images after necessary jobs pass (e.g. unit testing passes)
# Used by int/prod deploys — requires tests to pass.
#
docker:retag:
  extends: .emss-container-retag
  needs:
    - make-dotenv:fit
    - job: lint-js
      artifacts: false
    - job: lint-css
      artifacts: false
    - job: tsc
      artifacts: false
    - job: test-automerge-migrate
      artifacts: false
    - job: merge-vitest-coverage
      artifacts: false
    - job: test-vitest:browser
      artifacts: false
    - job: docker:build:nginx
      artifacts: false
    - job: docker:build:gdal
      artifacts: false
    - job: docker:build:apiv1
      artifacts: false
  variables:
    RETAG_SERVICE_IMAGES: |
      nginx
      gdal
      apiv1

# Retag for dev environments — does NOT require tests to pass.
# Allows dev deploys to proceed immediately after builds complete.
docker:retag:dev:
  extends: .emss-container-retag
  needs:
    - make-dotenv:fit
    - job: docker:build:nginx
      artifacts: false
    - job: docker:build:gdal
      artifacts: false
    - job: docker:build:apiv1
      artifacts: false
  variables:
    RETAG_SERVICE_IMAGES: |
      nginx
      gdal
      apiv1

deploy:artifactize-committed-files:
  image: "${CI_REGISTRY}/emss/docker-images:envsubst-bash-in-envsubst" # custom image, not on Docker Hub
  stage: stageless
  needs: []
  tags: ["openshift"]
  script:
    - echo "This job runs no commands, just turns .fitdock.yml and docker-compose.yml into artifacts"
  artifacts:
    paths:
      - .fitdock.yml
      - docker-compose.yml
      - scripts/upgrade-db.sh
    expire_in: 1 day

# Used by int/prod — requires tests to pass (via docker:retag)
.deploy-template:
  extends: .emss-fitdock-deploy # use job template from gitlab-templates repo
  needs:
    - make-dotenv:fit
    - docker:retag
    - deploy:artifactize-committed-files
  stage: stageless
  timeout: 10 minutes

# Used by dev envs — does NOT require tests to pass (via docker:retag:dev)
.deploy-template:dev:
  extends: .emss-fitdock-deploy
  needs:
    - make-dotenv:fit
    - docker:retag:dev
    - deploy:artifactize-committed-files
  stage: stageless
  timeout: 10 minutes

deploy:carbon:
  extends:
    - .deploy-template:dev
    - .carbon-deploy
  when: manual
  before_script:
    # This is currently our hack to change out a necessary var for Launchpad Auth
    - sed -i "s/INSERT_SUBDOMAIN/carbon-emss-dev/g" .env
    - sed -i "s/INSERT_LOG_DATA_SERVER_NAME/carbon/g" .env

deploy:gold:
  extends:
    - .deploy-template:dev
    - .gold-deploy
  when: manual
  before_script:
    # This is currently our hack to change out a necessary var for Launchpad Auth
    - sed -i "s/INSERT_SUBDOMAIN/gold-emss-dev/g" .env
    - sed -i "s/INSERT_LOG_DATA_SERVER_NAME/gold/g" .env

deploy:iron:
