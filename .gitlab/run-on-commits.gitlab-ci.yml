variables:
  CURRENT_NODE_VERSION_IMAGE: "$CI_REGISTRY/emss/docker-images/node:22.18.0-alpine"
  # "Future" might be older if waiting on a newer version to come out
  FUTURE_NODE_VERSION_IMAGE: "$CI_REGISTRY/emss/docker-images/node:24.4.1-alpine"

  # Default image unless otherwise specified
image: "$CURRENT_NODE_VERSION_IMAGE"

include:
  # A11y tests. Disabled for now.
  # - template: "Verify/Accessibility.gitlab-ci.yml"

  - project: "emss/gitlab-templates"
    ref: 2.6.0
    file:
      # Run standard FIT developer-ecosystem/ci-job-templates with emss
      # stageless overrides.
      # <https://gitlab.fit.nasa.gov/developer-ecosystem/ci-job-templates>
      - "/jobs/fit-ecosystem.gitlab-ci.yml"

      # Code quality checks
      - "/jobs/code-quality.gitlab-ci.yml"

      # Fitdock deploy template
      - "/jobs/fitdock-deploy.gitlab-ci.yml"

      # EMSS shared dev server helpers (carbon, iron, oxygen, etc)
      - "/jobs/emss-shared-dev.gitlab-ci.yml"

      # Kaniko build template
      - "/jobs/kaniko-build.gitlab-ci.yml"

      # Retag job template
      - "/jobs/container-retag.gitlab-ci.yml"

  # Adds jobs to export/import db, dump logs, and load tests on servers
  - local: .gitlab/includes/server-jobs.yml
  - local: .gitlab/includes/db-import.yml
  - local: .gitlab/includes/load-test.yml

project-check:
  variables:
    SCAN_FOR_DOCS: "no"
    ALLOWED_FILES: >
      src/packages
      src/tests/jest/factories/testZip.zip

dependency-check:
  stage: stageless
  tags: ["docker", "linux"] # can't use openshift (yet?)
  needs: ["install_dependencies"] # dependency-check takes a while, don't wait for "test" job
  rules:
    - if: '$CI_COMMIT_BRANCH == "int" || $CI_COMMIT_BRANCH == "prod"'

npm-audit:
  stage: stageless
  image: $CI_REGISTRY/emss/docker-images/node-ci:npm-audit
  when: manual
  needs: []
  tags: ["openshift"]
  allow_failure: true
  script:
    # Run this without --json to make a pretty-print for the job log, plus will pass/fail the job
    - npm audit

install_dependencies:
  stage: stageless
  # This could be openshift, but it runs faster in a VM; other jobs rely on it, so get it done ASAP
  tags: ["docker", "linux"]
  script:
    - npm ci
  artifacts:
    expire_in: 1 day
    paths:
      - ./node_modules/*

#
# Creates Software Bill of Materials
#
node-sbom:
  stage: stageless
  tags: ["docker", "linux"] # Can't be openshift due to it not pulling latest tag
  needs: ["install_dependencies"]
  image: $CI_REGISTRY/emss/docker-images/node-ci:sbom
  script:
    - /make-sbom.sh
  artifacts:
    when: always
    paths:
      - "./bom.json"
      - "./BOM.md"
    expire_in: 1 day

# Template for `test` and `test-node-next` jobs, adding database service, etc.
.test_template:
  stage: stageless
  needs:
    - install_dependencies
    - make-test-dotenv
    - z:db-export:prod
  variables:
    # define variables used by Node app
    DB_HOST: postgres-test-container
    DB_PASS: test-only-password
    DB_NAME: aegis

    # plug those same variables into the Postgres container we're spinning up
    POSTGRES_PASSWORD: test-only-password
    POSTGRES_DB: aegis
  services:
    # image should match database used in docker-compose.yml
    - name: $CI_REGISTRY/emss/docker-images/postgres:postgis-14-alpine
      alias: postgres-test-container
  tags: ["docker", "linux"]
  before_script:
    # Remove lines from .env file. See "Variable Precedence" section above
    - sed -i '/DB_PASS/d' .env
    - sed -i '/DB_HOST/d' .env
    - sed -i '/DB_NAME/d' .env

test:
  extends: .test_template
  script:
    # Load production database dump
    - apk update && apk add --no-cache postgresql-client # Install psql client using apk for Alpine
    - PGPASSWORD=$DB_PASS psql -h $DB_HOST -U postgres -d $DB_NAME < aegis.sql
    - npm run migration:up
    # Create schemas so the references resolve
    - npm run schema:create
    # Run all the other things
    - npm run lint
    - npm run tsc
    - npm run test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: ./coverage/cobertura-coverage.xml
      junit:
        - junit.xml
    paths:
      - ./coverage/*
    expire_in: 1 day

# test against next version of node that AEGIS may use, but allow to fail
test-node-next:
  extends: .test_template
  image: "$FUTURE_NODE_VERSION_IMAGE"
  allow_failure: true
  script:
    # Load production database dump
    - apk update && apk add --no-cache postgresql-client # Install psql client using apk for Alpine
    - PGPASSWORD=$DB_PASS psql -h $DB_HOST -U postgres -d $DB_NAME < aegis.sql
    - npm run migration:up
    # Create schemas so the references resolve
    - npm run schema:create
    # Run all the other things
    - npm run lint
    - npm run tsc
    - npm t

playwright_test:
  parallel:
    matrix:
      - SHARD_INDEX: 1
      - SHARD_INDEX: 2
      - SHARD_INDEX: 3
      - SHARD_INDEX: 4
  variables:
    NUM_SHARDS: 4
  extends: .test_template
  stage: stageless
  image: mcr.microsoft.com/playwright:v1.54.2-jammy
  needs:
    - install_dependencies
    - make-test-dotenv
    - z:db-export:prod
  script:
    - echo "Running shard $SHARD_INDEX of $NUM_SHARDS"
    - mkdir -p playwright-report
    - apt-get update && apt-get install -y postgresql-client # Fast install, fine not in the image
    - PGPASSWORD=$DB_PASS psql -h $DB_HOST -U postgres -d $DB_NAME < aegis.sql
    - npx playwright install-deps # Install Playwright dependencies
    - npm run migration:up
    - npm run test:playwright:ci # Run Playwright tests
  timeout: 10 minutes
  artifacts:
    when: always
    paths:
      - playwright-report/ # Store Playwright test reports
    expire_in: 1 day
  retry: 2

.make-dotenv-template:
  image: "$CURRENT_NODE_VERSION_IMAGE"
  stage: stageless
  needs: []
  tags: ["docker", "linux"]
  before_script:
    # Determine the versions of @emss/make-dotenv and tsx defined in package-lock.json
    # This allows us to be sure the same versions are used in CI as are used in local dev
    - MAKE_DOTENV_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@emss/make-dotenv'].version")
    - TSX_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/tsx'].version")

    # Globally install these packages. This allows us to use them without installing
    # all packages specified in package.json, which takes 1-4 minutes depending on the
    # repository.
    #
    # Other options:
    #   1. We could make this job have `needs: ['install_dependencies']`, but that means
    #      this job would be delayed running 1-4 minutes, which then delays container
    #      builds 1-4 minutes.
    #   2. We could have the emss/packages build a make-dotenv docker image tagged by its
    #      version number, and then this job could run using that image by specifying
    #      `image: $CI_REGISTRY/emss/packages/make-dotenv:x.y.z`. That would save some
    #      time since we wouldn't need to install global packages each time, but the job
    #      as-written runs in about 10 seconds, so we wouldn't be saving much. We would
    #      be causing ourselves some problems, though, since we'd have a version of
    #      @emss/make-dotenv specified in package(-lock).json, and then we'd have another
    #      version specified on the docker image on this job. We'd have to be careful to
    #      keep the two in sync. The current job as-written seems simpler and good enough.
    - npm i -g "@emss/make-dotenv@${MAKE_DOTENV_VERSION}" --userconfig ./.npmrc
    - npm i -g "tsx@${TSX_VERSION}"
  script:
    # Copy contents of DOTENV_SECRET from CI/CD variables to a new .env.secret file
    - echo "${DOTENV_SECRET_TS}" > ./env.secret.ts

    # Determine which docker image type (dev, int, or prod) to deploy based on branch
    # Append the commit sha in order to ensure the correct build is being deployed in the case
    # multiple devs are building images simultaneously
    - >
      if [ "${CI_COMMIT_REF_SLUG}" == "prod" ]; then
          IMAGE_VERSION="prod-${CI_COMMIT_SHORT_SHA}"
      elif [ "${CI_COMMIT_REF_SLUG}" == "int" ]; then
          IMAGE_VERSION="int-${CI_COMMIT_SHORT_SHA}"
      else
          IMAGE_VERSION="dev-${CI_COMMIT_SHORT_SHA}"
      fi

    # Export the variable so it can be read inside the make-dotenv package
    - export IMAGE_VERSION
    # Save image version into an artifact to be read later in other job scripts
    - echo "IMAGE_VERSION=${IMAGE_VERSION}" >> pipelineVariables.env

    - make-dotenv "${MAKEDOTENV_ENV}"

  artifacts:
    reports:
      dotenv: pipelineVariables.env
    paths:
      - .env
    expire_in: 1 day

make-dotenv:
  extends: .make-dotenv-template
  variables:
    MAKEDOTENV_ENV: "fit"

make-test-dotenv:
  extends: .make-dotenv-template
  variables:
    MAKEDOTENV_ENV: "test"

#
# Build container images
# Vite is not used in production, so we don't need to build it
#

.kaniko-build-template:
  extends: .emss-kaniko-build
  stage: stageless
  tags: ["docker", "linux"]
  needs:
    - make-dotenv

docker:build:nginx:
  extends: .kaniko-build-template
  variables:
    SERVICE_NAME: nginx
    MULTISTAGE_TARGET: prod
    NGINX_BASE_IMAGE: eegitlabregistry.fit.nasa.gov/emss/docker-images/nginx:1.23.0-alpine
    NODE_BASE_IMAGE: $CURRENT_NODE_VERSION_IMAGE
    GIT_COMMIT: $CI_COMMIT_SHORT_SHA
    MAP_ENV_VARS_TO_BUILD_ARGS: |
      NGINX_BASE_IMAGE
      NODE_BASE_IMAGE
      GIT_COMMIT

docker:build:gdal:
  extends: .kaniko-build-template
  variables:
    SERVICE_NAME: gdal
    MULTISTAGE_TARGET: base
    GDAL_BASE_IMAGE: eegitlabregistry.fit.nasa.gov/emss/docker-images/deploy:gdal
    MAP_ENV_VARS_TO_BUILD_ARGS: |
      GDAL_BASE_IMAGE

docker:build:apiv1:
  extends: .kaniko-build-template
  variables:
    SERVICE_NAME: apiv1
    MULTISTAGE_TARGET: prod
    APIV1_BASE_IMAGE: $CURRENT_NODE_VERSION_IMAGE
    GIT_COMMIT: $CI_COMMIT_SHORT_SHA
    MAP_ENV_VARS_TO_BUILD_ARGS: |
      APIV1_BASE_IMAGE
      GIT_COMMIT

#
# Retag docker images after necessary jobs pass (e.g. unit testing passes)
#
docker:retag:
  extends: .emss-container-retag
  needs:
    - make-dotenv
    - job: test
      artifacts: false
    - job: docker:build:nginx
      artifacts: false
    - job: docker:build:gdal
      artifacts: false
    - job: docker:build:apiv1
      artifacts: false
  variables:
    RETAG_SERVICE_IMAGES: |
      nginx
      gdal
      apiv1

deploy:artifactize-committed-files:
  image: "$CI_REGISTRY/emss/docker-images:envsubst-bash-in-envsubst"
  stage: stageless
  needs: []
  tags: ["openshift"]
  script:
    - echo "This job runs no commands, just turns .fitdock.yml and docker-compose.yml into artifacts"
  artifacts:
    paths:
      - .fitdock.yml
      - docker-compose.yml
    expire_in: 1 day

.deploy-template:
  extends: .emss-fitdock-deploy # use job template from gitlab-templates repo
  needs:
    - make-dotenv
    - docker:retag
    - deploy:artifactize-committed-files
  stage: stageless
  timeout: 10 minutes

deploy:carbon:
  extends:
    - .deploy-template
    - .carbon-deploy
  when: manual
  before_script:
    # This is currently our hack to change out a necessary var for Launchpad Auth
    - sed -i "s/INSERT_SUBDOMAIN/carbon-emss-dev/g" .env
    - sed -i "s/INSERT_LOG_DATA_SERVER_NAME/carbon/g" .env

