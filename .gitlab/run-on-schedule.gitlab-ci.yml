.db-export-template:
  needs: []
  # I don't think we want to do this, because I don't think we want GitLab to consider this a
  # deployment. It's just grabbing some data off of Production.
  # environment:
  #   name: production
  #   url: https://aegis.fit.nasa.gov
  when: manual
  stage: stageless
  timeout: 10 minutes
  variables:
    GIT_STRATEGY: none
  script:
    # init sudo ability
    - echo "${DEPLOY_SUDO_PASS}" | sudo -S touch /tmp/somefile
    - PROJECT_DIR=$(pwd)
    - cd /opt/aegis
    # Exclude PostGIS schemas/tables and strip extension DDL from the dump.
    # pg_dump has no --exclude-extension flag, so extension CREATE/COMMENT lines are piped
    # through sed. Import jobs also strip (defense-in-depth for old cached dumps).
    # IMPORTANT: Keep pattern synchronized with .gitlab/scripts/load-sql-dump.mjs
    - sudo docker compose exec database pg_dump -U postgres aegis
      --exclude-schema=tiger
      --exclude-schema=tiger_data
      --exclude-schema=topology
      --exclude-table=public.spatial_ref_sys
      | sed -E
      '/^CREATE EXTENSION.*(postgis|tiger|topology|fuzzystrmatch)/d;
      /^COMMENT ON EXTENSION (postgis|tiger|topology|fuzzystrmatch)/d'
      > "${PROJECT_DIR}/aegis.sql"
  artifacts:
    name: "${CI_JOB_STARTED_AT}-aegis.sql"
    paths:
      - aegis.sql
    # hold on to this artifact longer than default (1 day). The latest for any branch never expires
    expire_in: 60 days

z:db-export:prod:
  extends: .db-export-template
  rules:
    - if: $SCHEDULE_TYPE == "backup"
      when: always
  tags: ["emss-aegis-prod"]
  resource_group: prod # prevents concurrent executions of this job when there are multiple pipelines
  variables:
    DEPLOY_SUDO_PASS: ${DEPLOY_SUDO_PASS_PROD}

# Validate every Automerge mission document
#
# The runner checks every mission before exiting and writes all violations
# to a JSON report that is kept as a downloadable artifact.
# The job fails if any mission is invalid or could not be read.
automerge-schema-validate:
  stage: stageless
  tags: ["openshift"]
  rules:
    - if: $SCHEDULE_TYPE == "backup"
      when: always
  timeout: 30 minutes
  needs:
    - install_dependencies
    - make-dotenv:test
    - z:db-export:prod
  variables:
    # define variables used by Node app
    DB_HOST: postgres-test-container
    DB_PASS: test-only-password
    DB_NAME: aegis

    # plug those same variables into the Postgres container we're spinning up
    POSTGRES_PASSWORD: test-only-password
    POSTGRES_DB: aegis
  services:
    # DOCKER_IMAGE_DATABASE comes from the make-dotenv:test job artifact
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/${DOCKER_IMAGE_DATABASE}
      alias: postgres-test-container
      variables:
        # OpenShift runs containers as a random non-root UID. The default
        # PGDATA (/var/lib/postgresql/data) is owned by the postgres user
        # (UID 70 on alpine) and not writable by an arbitrary UID, so initdb
        # fails silently and postgres never starts. Redirecting PGDATA to
        # /tmp lets initdb create the data directory regardless of UID.
        PGDATA: /tmp/pgdata
  before_script:
    # node_modules is shipped as a tarball artifact (see install_dependencies)
    - tar -xf node_modules.tar
    # The service container's credentials win over whatever make-dotenv wrote
    - sed -i '/DB_PASS/d' .env
    - sed -i '/DB_HOST/d' .env
    - sed -i '/DB_NAME/d' .env
    # OpenShift runners can't write to /d1; redirect file uploads to /tmp.
    - sed -i 's|^STATIC_DIR=.*|STATIC_DIR=/tmp/aegis-static|' .env
    - mkdir -p /tmp/aegis-static
  script:
    - node .gitlab/scripts/load-sql-dump.mjs aegis.sql
    - npm run automerge:validate
  artifacts:
    when: always
    name: "${CI_JOB_STARTED_AT}-automerge-schema-validation"
    paths:
      - .local/schema-validation-report-*.json
    expire_in: 60 days

# Run the audit on a different schedule than the backups
npm-audit:
  stage: stageless
  rules:
    - if: $SCHEDULE_TYPE == "audit"
      when: always
  tags: ["openshift"]
  image: ${CI_REGISTRY}/emss/docker-images/node-ci:npm-audit # custom image, not on Docker Hub
  allow_failure: true
  script:
    # Run this without --json to make a pretty-print for the job log, plus will pass/fail the job
    - npm audit
