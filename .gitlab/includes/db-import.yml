#
# Adds jobs to import the prod database dump into the database.
# Must have exported the prod database first
# Put these jobs in a separate file so they can be included in both gitlab-ci.yml files
#

.db-import-template:
  when: manual
  stage: stageless
  needs: ["z:db-export:prod"]
  timeout: 10 minutes
  variables:
    GIT_STRATEGY: none
  script:
    # init sudo ability
    - echo "${DEPLOY_SUDO_PASS}" | sudo -S touch /tmp/somefile
    - PROJECT_DIR=$(pwd)
    - cd /opt/aegis
    # Clear the init dir before writing — removes any leftover restore-dump.sql from a prior upgrade-db run
    # so Postgres doesn't try to replay both files when it reinitializes.
    - sudo rm -f /d1/aegis/db-init/*.sql
    # Strip PostGIS content from historical dumps (pre-postgres:17 migration).
    # IMPORTANT: Keep pattern synchronized with .gitlab/scripts/load-sql-dump.mjs,
    # scripts/upgrade-db.sh, and .gitlab/includes/server-jobs.yml
    - sed -E '/^CREATE EXTENSION.*(postgis|tiger|topology|fuzzystrmatch).*;$/d; /^COMMENT ON EXTENSION (postgis|tiger|topology|fuzzystrmatch).*;$/d; /^CREATE SCHEMA (tiger|tiger_data|topology);$/d; /^ALTER SCHEMA (tiger|tiger_data|topology) OWNER TO .*;$/d; /^COMMENT ON SCHEMA (tiger|tiger_data|topology) .*;$/d; /^COPY (public\.spatial_ref_sys|tiger\.[a-z_]+|topology\.[a-z_]+) .* FROM stdin;$/,/^\\.$/d' "${PROJECT_DIR}/aegis.sql" > /d1/aegis/db-init/aegis.sql

    # Stop docker compose, then remove database files
    - sudo /usr/bin/docker compose down --remove-orphans
    - sudo rm -rf /d1/aegis/postgres

    # Bring docker compose back up, which will use the file at /d1/aegis/db-init/aegis.sql, then remove it
    - sudo /usr/bin/docker compose up -d
    - sudo rm -f /d1/aegis/db-init/aegis.sql

    # Migrations will be run when the apiv1 container restarts

z:db-import:carbon:
  extends:
    - .db-import-template
    - .carbon-deploy

z:db-import:gold:
  extends:
    - .db-import-template
    - .gold-deploy

z:db-import:iron:
  extends:
    - .db-import-template
    - .iron-deploy

z:db-import:neon:
  extends:
    - .db-import-template
    - .neon-deploy

z:db-import:oxygen:
  extends:
    - .db-import-template
    - .oxygen-deploy

z:db-import:int:
  extends: .db-import-template
  tags: ["emss-aegis-int"]
  resource_group: int # prevents concurrent executions on this environment when there are multiple pipelines
  environment:
    name: integration
    url: ${URL}
  variables:
    DEPLOY_SUDO_PASS: ${DEPLOY_SUDO_PASS_INT} #CI/CD Variable
    URL: https://aegis-int.fit.nasa.gov

#
# These jobs are used for restoring a database from a .sql dump file.
#

# The .sql file must be uploaded to the /d1/aegis/ directory on gold (jsfitdaegis01) before running
# This job takes the .sql file and puts in it's artifacts so the next job can use it
z:db-restore:artifactize-db-file:gold:
  needs: []
  extends:
    - .gold-access
  when: manual
  stage: stageless
  timeout: 10 minutes
  variables:
    GIT_STRATEGY: none
  script:
    - sudo cp /d1/aegis/aegis.sql "${PROJECT_DIR}/aegis.sql"
  artifacts:
    paths:
      - aegis.sql
    expire_in: 1 day

z:db-restore:int-from-gold:
  extends: .db-import-template
  # Overrides the `needs` from the template and get .sql artifact from a different job
  needs: ["z:db-restore:artifactize-db-file:gold"]
  tags: ["emss-aegis-int"]
  resource_group: int # prevents concurrent executions on this environment when there are multiple pipelines
  environment:
    name: integration
    url: ${URL}
  variables:
    DEPLOY_SUDO_PASS: ${DEPLOY_SUDO_PASS_INT} #CI/CD Variable
    URL: https://aegis-int.fit.nasa.gov
