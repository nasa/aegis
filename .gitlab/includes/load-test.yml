#
# This file handles the load test job
#
# There is no account-setup step. Identity comes from the Launchpad token, so there is no username
# or password for the load test to create or log in with.
#
# The target must therefore already admit the load test's unauthenticated requests, which means a
# host running with MOCK_USER=true where every request resolves to the mock identity. Against a
# host with real Launchpad auth, nginx answers the oauth2 sign-in redirect before the API is
# reached and the load test exits on its first request.
#

stages:
  - stageless

# Runs the actual load test on 16 shards. Each one will start 30 (defined in startLoadTest.ts) clients
.run-load-test-template:
  when: manual
  stage: stageless
  timeout: 10 minutes
  parallel: 16
  tags:
    - openshift-test
  variables:
    GIT_COMMIT: ${CI_COMMIT_SHORT_SHA}
  script:
    # node_modules is shipped as a tarball artifact (see install_dependencies)
    - tar -xf node_modules.tar

    - npm run test:loadtest:build
    - npm run test:loadtest https://${SERVER_SUBDOMAIN}.fit.nasa.gov/

run-load-test:int:
  extends: .run-load-test-template
  needs:
    - install_dependencies
    - make-dotenv:fit
  variables:
    SERVER_SUBDOMAIN: aegis-int
  resource_group: int # prevents concurrent executions on this environment when there are multiple pipelines
  only:
    - int

run-load-test:argon:
  extends: .run-load-test-template
  needs:
    - install_dependencies
    - make-dotenv:fit
  variables:
    SERVER_SUBDOMAIN: argon-emss-dev

