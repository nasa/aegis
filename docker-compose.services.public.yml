#
# DOCKER OVERRIDE FILE:
# Layered on top of docker-compose.yml + docker-compose.services.yml.
#
# SUMMARY:
# For open-source / external users without access to the private EE registry. Instead of building
# the GDAL image locally from the private base image (docker-compose.services.yml), pull the
# prebuilt public image from Docker Hub. See "Public GDAL image" in the README.
#
# Usage: npm run docker:services:public
#
services:
  gdal:
    image: bfeistnasa/aegis-gdal:latest
    build: !reset null # don't build locally; use the public image as-is
    working_dir: /app
    command: ["python", "elevationService.py"]
