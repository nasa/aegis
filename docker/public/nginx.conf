user nginx;
worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # Only authenticated locations can supply an identity to AEGIS.
    proxy_set_header X-Access-Token "";
    proxy_set_header X-User "";
    proxy_set_header X-Email "";
    proxy_cache_path /var/cache/nginx/cog levels=1:2 keys_zone=cog_cache:10m max_size=4g inactive=30d;

    server {
        listen 127.0.0.1:8081;
        root /usr/share/nginx/html;
    }

    server {
        listen 443 ssl;
        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        root /usr/share/nginx/html;
        client_max_body_size 50G;

        location /oauth2/ {
            proxy_pass http://mock-auth:4180;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Auth-Request-Redirect $scheme://$http_host$request_uri;
        }
        location = /oauth2/auth {
            internal;
            proxy_pass http://mock-auth:4180;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Host $http_host;
        }
        location = /is-logged-in {
            proxy_pass http://mock-auth:4180/oauth2/auth;
            add_header Cache-Control "no-store" always;
        }
        location = /login {
            include /etc/nginx/require-auth.conf;
            error_page 401 = /oauth2/start;
            try_files /loggedin.html =404;
            add_header Cache-Control "no-store" always;
        }
        location = /logout {
            proxy_pass http://mock-auth:4180/oauth2/sign_out;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location = /loggedout { try_files /loggedout.html =404; }

        # Machine routes validate their API key in AEGIS and receive no browser identity.
        location ~ ^/api/v1/((health|version|time|metrics)$|maestro/|external/) {
            proxy_pass http://apiv1:4001;
        }
        location /api/v1/ {
            include /etc/nginx/require-auth.conf;
            proxy_pass http://apiv1:4001;
        }
        # Both browser socket transports require a gateway session on every connection.
        location ~ ^/api/(socket|automergeSocket)/? {
            include /etc/nginx/require-auth.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass http://apiv1:4001;
        }

        location ~* ^/static/.*\.(tif|tiff)$ {
            include /etc/nginx/require-auth.conf;
            slice 512k;
            proxy_cache cog_cache;
            proxy_cache_key "$uri$slice_range";
            proxy_cache_valid 200 206 30d;
            proxy_set_header Range $slice_range;
            proxy_pass http://127.0.0.1:8081;
            expires 30d;
            add_header Accept-Ranges bytes;
        }
        location /static/ {
            include /etc/nginx/require-auth.conf;
            expires 30d;
            try_files $uri =404;
        }
        location / {
            include /etc/nginx/require-auth.conf;
            error_page 401 = /oauth2/start;
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
