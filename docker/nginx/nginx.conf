user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # All EMSS Nginx log_format must be this format, to be ingested properly by
    # emss/logs logstash
    log_format main '$remote_addr $http_x_forwarded_for "$remote_user" $email [$time_local] "$host" '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;

    proxy_connect_timeout       28800;
    proxy_send_timeout          28800;
    proxy_read_timeout          28800;
    send_timeout                28800;

    #gzip  on;

    # ------------------------------------------------------------------
    # COG byte-range cache
    # First user's Range requests populate the cache; all subsequent
    # users are served pre-sliced chunks from the cache (RAM/disk).
    # ------------------------------------------------------------------
    proxy_cache_path /var/cache/nginx/cog
        levels=1:2
        keys_zone=cog_cache:10m
        max_size=4g
        inactive=30d
        use_temp_path=off;

    # Internal origin — serves COG files from disk so the main server
    # can proxy to it and cache the byte-range slices.
    server {
        listen 127.0.0.1:8081;
        root /usr/share/nginx/html;

        location / {
            sendfile on;
            tcp_nopush on;
            aio threads;
        }
    }

    server {

        listen 443 ssl;
        listen [::]:443 ssl;
        server_name  aegisnginx;

        ssl_certificate      /etc/pki/tls/certs/nginx.crt;
        ssl_certificate_key  /etc/pki/tls/private/nginx.key;
        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        client_max_body_size 50G;

        root /usr/share/nginx/html;

        include setup-auth.conf;

        #
        # Serve react app
        # Note: The /static folder is mapped in the docker-compose.yml file
        #
        # Location blocks are assessed in the following order:
        # 1. Exact Match `location = /path`
        # 2. Longest Prefix Match
        # 3. Regex Match (in order they appear in the file)
        # 4. Default prefix `location /`
        #

        # index.html must NEVER be cached, otherwise users can get stuck on an old bundle after a deploy.
        # Hashed JS/CSS assets below are still cached aggressively.
        location = /index.html {
            include route-require-auth.conf;

            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location / {
            # Enforce launchpad auth
            include route-require-auth.conf;

            # Prevent caching of the SPA fallback -- any URL that falls through
            # to index.html must always be revalidated so users pick up new
            # bundle hashes after a deploy.
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;

            try_files $uri $uri/ /index.html;  # Rewrite all requests to index.html
        }

        # Mission files are data, not SPA routes. Without this a missing file would fall
        # through to the /index.html rewrite above and return HTML with a 200, so callers
        # probing for optional sidecars (tilemapresource.xml, manifest.json) would see a
        # "hit" instead of a miss. Prefix match, not `^~`, so the regex blocks below still
        # apply to .json/.png/.tif under /static/.
        location /static/ {
            include route-require-auth.conf;

            # Same no-cache policy these files got when they fell through to `location /`.
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;

            try_files $uri =404;
            log_not_found off;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|geojson|json)$ {
            # Enforce launchpad auth
            include route-require-auth.conf;

            expires max;
            log_not_found off;
        }

        # Cloud Optimized GeoTIFF — server-side Range-slice caching.
        # nginx slices each Range request into fixed 512KB chunks, caches
        # them via proxy_cache, and serves subsequent users from cache.
        # The internal origin on :8081 reads the actual file from disk.
        location ~* \.tif$ {
            include route-require-auth.conf;

            types {
                image/tiff  tif tiff;
            }

            # Slice Range requests into cacheable 512KB chunks.
            # COG internal tiles are typically 256-512KB so this aligns well.
            slice              512k;
            proxy_cache        cog_cache;
            proxy_cache_key    "$uri$slice_range";
            proxy_cache_valid  200 206 30d;
            proxy_set_header   Range $slice_range;
            proxy_http_version 1.1;
            proxy_pass         http://127.0.0.1:8081;

            # Browser-side caching (same user revisiting)
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Accept-Ranges bytes;

            # Debug header — shows HIT/MISS/EXPIRED (remove if not wanted)
            add_header X-Cache-Status $upstream_cache_status always;

            log_not_found off;
        }

        # Put the user endpoint behind auth
        location /api/v1/user/current {
            # Enforce launchpad auth
            include route-require-auth.conf;

            proxy_pass http://apiv1:4001/api/v1/user/current;
            proxy_redirect off;
            proxy_buffering off;
        }

        # Put the logging endpoint behind auth so launchpad user info can be passed on
        location /api/v1/log/from-client {
            # Enforce launchpad auth
            include route-require-auth.conf;

            proxy_pass http://apiv1:4001/api/v1/log/from-client;
            proxy_redirect off;
            proxy_buffering off;
        }

        #
        # Serve API container. Allow all traffic because auth is handled
        # internally by the API
        #
        location /api/v1/ {
            proxy_pass http://apiv1:4001/api/v1/;
            proxy_redirect off;
            proxy_buffering off;

            # For websockets. The legacy V1 maegistro /maestro namespace is still using this
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        #
        # Sockets
        #
        location /api/socket/ {
            proxy_pass http://apiv1:4001/api/socket/;
            proxy_redirect off;
            proxy_buffering off;

            # For websockets
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /api/automergeSocket/ {
            proxy_pass http://apiv1:4001/api/automergeSocket/;
            proxy_redirect off;
            proxy_buffering off;

            # For websockets
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Compatibility redirect: older client bundles connect to the previous
        # Automerge WS path. Proxy them to the current upstream endpoint so
        # stale browser tabs keep syncing until users reload. Safe to remove
        # once all clients have picked up the new bundle.
        location /api/v1/socketAutomerge/ {
            proxy_pass http://apiv1:4001/api/automergeSocket/;
            proxy_redirect off;
            proxy_buffering off;

            # For websockets
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
