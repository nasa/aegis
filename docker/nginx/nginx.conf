user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # All EMSS Nginx log_format must be this format, to be ingested properly by
    # emss/logs logstash
    log_format main '$remote_addr $http_x_forwarded_for "$remote_user" $email [$time_local] "$host" '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;

    proxy_connect_timeout       28800;
    proxy_send_timeout          28800;
    proxy_read_timeout          28800;
    send_timeout                28800;

    #gzip  on;

    server {

        listen 443 ssl;
        listen [::]:443 ssl;
        server_name  aegisnginx;

        ssl_certificate      /etc/pki/tls/certs/nginx.crt;
        ssl_certificate_key  /etc/pki/tls/private/nginx.key;
        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        client_max_body_size 50G;

        root /usr/share/nginx/html;

        include setup-auth.conf;

        #
        # Serve react app
        # Note: The /static folder is mapped in the docker-compose.yml file
        #
        # Location blocks are assessed in the following order:
        # 1. Exact Match `location = /path`
        # 2. Longest Prefix Match
        # 3. Regex Match (in order they appear in the file)
        # 4. Default prefix `location /`
        #

        # index.html must NEVER be cached, otherwise users can get stuck on an old bundle after a deploy.
        # Hashed JS/CSS assets below are still cached aggressively.
        location = /index.html {
            include route-require-auth.conf;

            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location / {
            # Enforce launchpad auth
            include route-require-auth.conf;

            # Prevent caching of the SPA fallback -- any URL that falls through
            # to index.html must always be revalidated so users pick up new
            # bundle hashes after a deploy.
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;

            try_files $uri $uri/ /index.html;  # Rewrite all requests to index.html
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|geojson|json)$ {
            # Enforce launchpad auth
            include route-require-auth.conf;

            expires max;
            log_not_found off;
        }

        # Put the user endpoint behind auth
        location /api/v1/user/current {
            # Enforce launchpad auth
            include route-require-auth.conf;

            proxy_pass http://apiv1:4001/api/v1/user/current;
            proxy_redirect off;
            proxy_buffering off;
        }

        # Put the logging endpoint behind auth so launchpad user info can be passed on
        location /api/v1/log/from-client {
            # Enforce launchpad auth
            include route-require-auth.conf;

            proxy_pass http://apiv1:4001/api/v1/log/from-client;
            proxy_redirect off;
            proxy_buffering off;
        }

        #
        # Serve API container. Allow all traffic because auth is handled
        # internally by the API
        #
        location /api/v1/ {
            proxy_pass http://apiv1:4001/api/v1/;
            proxy_redirect off;
            proxy_buffering off;

            # For websockets
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
