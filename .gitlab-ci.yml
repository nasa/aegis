stages:
  - stageless

  # This isn't used, but there are some tests within the FIT developer-ecosystem set that
  # expect to be run in the `test` stage. These tests are not run in this pipeline due to it not
  # having any of the requirements (e.g. Golang or PHP code). We could call them all out and specify
  # where they would run, or remove them, but it's easier to just make this unused "test".
  - test

default:
  artifacts:
    # Aggressively expire artifacts. The latest for any branch never expires
    expire_in: 1 day
  timeout: 10 minutes

variables:
  HOME: "/tmp" # required for openshift for now
  EMSS_DEPLOY_IMAGE: "$CI_REGISTRY/emss/docker-images:deploy-node-14-alpine"
  CURRENT_NODE_VERSION_IMAGE: "$CI_REGISTRY/emss/docker-images:node-18-alpine"
  # "Future" might be older if waiting on a newer version to come out
  FUTURE_NODE_VERSION_IMAGE: "$CI_REGISTRY/emss/docker-images:node-16-alpine"

# Default image unless otherwise specified
image: "$CURRENT_NODE_VERSION_IMAGE"

# This folder is cached between builds
# http://docs.gitlab.com/ee/ci/yaml/README.html#cache
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .next/cache/

# also run standard FIT dependency and package checks
# https://gitlab.fit.nasa.gov/developer-ecosystem/ci-job-templates
include:
  - project: "developer-ecosystem/ci-job-templates"
    ref: 3.3.0
    file: "/rollups/all-projects.gitlab-ci.yml"
  # - template: "Verify/Accessibility.gitlab-ci.yml"

# Overrride some properties on FIT jobs. Unfortunately using a template for these
# make GitLab angry, so a lot of repetition
project-check:
  stage: stageless
  needs: []
  tags: ["openshift"]
eslint-sast:
  stage: stageless
  needs: []
  tags: ["openshift"]
nodejs-scan-sast:
  stage: stageless
  needs: []
  tags: ["openshift"]
semgrep-sast:
  stage: stageless
  needs: []
  tags: ["openshift"]
sast:
  stage: stageless
  needs: []
  tags: ["openshift"]
secret_detection:
  stage: stageless
  needs: []
  tags: ["openshift"]
code-count:
  stage: stageless
  needs: []
  tags: ["openshift"]
# accessibility:
#   stage: stageless
#   needs: ["some deploy job or a running system in GitLab"]
#   tags: ["openshift"]

# manually overwrite the dependency-check to add our own suppression.xml
dependency-check:
  stage: stageless
  needs: ["install_dependencies"] # dependency-check takes a while, don't wait for "test" job
  tags: ["docker", "linux"] # can't use openshift yet
  image:
    # Specify the Docker image to be used for the job, which is a customized image for running OWASP
    # dependency-check in a GitLab CI job
    name: $CI_REGISTRY/developer-ecosystem/dependency-check:latest
    # Entrypoint is overridden to allow a script to be run
    entrypoint: [""]
  script:
    # Run dependency-check from the location installed in the Docker container with the following arguments:
    # --scan "./"                                         Scans all files and folders within the working folder,
    #                                                     which contains the repository files as well as any
    #                                                     artifacts from prior jobs in the pipeline
    # --format ALL                                        Saves output in all formats so that HTML and JSON
    #                                                     files are available
    # --project "$CI_PROJECT_NAME"                        Use the GitLab project name, which is included in
    #                                                     the report
    # --failOnCVSS 0                                      Forces job to fail if any vulnerabilities are found
    # --suppression /suppressions/fp-cpe-suppression.xml  Suppress false positives where the dependency is
    #                                                     improperly identified
    # --suppression /suppressions/fp-cve-suppression.xml  Suppress false positives where the dependency is
    #                                                     properly identified, but the  CVE is a false positive
    - >
      /usr/share/dependency-check/bin/dependency-check.sh --scan "./"
      --format ALL
      --project "$CI_PROJECT_NAME"
      --failOnCVSS 0
      --suppression /suppressions/fp-cpe-suppression.xml
      --suppression /suppressions/fp-cve-suppression.xml
      --suppression ./.gitlab/dependency-check-suppression.xml
      
  # Allow failure will report a failure, but continue execution of the pipeline
  allow_failure: true
  artifacts:
    # Saving artifacts always forces them to be saved on failure as well as success
    when: always
    # Save the HTML and JSON formatted results as artifacts
    paths:
      - "./dependency-check-report.html"
      - "./dependency-check-report.json"

npm-audit:
  stage: stageless
  needs: []
  tags: ["openshift"]
  allow_failure: true
  script:
    - npm audit --json > npm-audit-report.json && echo "No vulnerabilities found" || npm audit
  artifacts:
    # Saving artifacts always forces them to be saved on failure as well as success
    when: always
    # Save the JSON formatted results as an artifact
    paths:
      - "./npm-audit-report.json"

install_dependencies:
  stage: stageless

  # This could be openshift, but it runs faster in a VM; other jobs rely on it, so get it done ASAP
  tags: ["docker", "linux"]
  script:
    - npm ci
  artifacts:
    expire_in: 1 day
    paths:
      - ./node_modules/*

#
# Creates Software Bill of Materials
#
node-sbom:
  stage: stageless
  allow_failure: true
  tags: ["docker", "linux"] # Can't be openshift due to it not pulling latest tag
  needs: ["install_dependencies"]
  image: $CI_REGISTRY/emss/docker-images:node-ci-sbom
  script:
    - /create-and-compare-bom.sh ./BOM.md
  artifacts:
    when: always
    paths:
      - "./bom.json"
      - "./new-bom.md"

test:
  stage: stageless
  needs: ["install_dependencies"]
  tags: ["openshift"]
  script:
    # - sh ./.gitlab/create-fit-dotenv.sh test
    - npm run lint
    - npm run tsc
    - npm run test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: ./coverage/cobertura-coverage.xml
      junit:
        - junit.xml
    paths:
      - ./coverage/*

# test against next version of node that CODA may use, but allow to fail
test-node-next:
  stage: stageless
  image: "$FUTURE_NODE_VERSION_IMAGE"
  needs: ["install_dependencies"]
  tags: ["openshift"]
  allow_failure: true
  script:
    # - sh ./.gitlab/create-fit-dotenv.sh test
    - npm run lint
    - npm run tsc
    - npm t

build:
  stage: stageless
  needs: ["install_dependencies"]

  # Could be openshift, but it runs faster in a VM; Since it's the longest-running job, run in VM.
  # If running with OpenShift, may need to set HOME to `/root` and use a didfferent container image.
  # See CODA and perhaps Maestro.
  tags: ["docker", "linux"]
  script:
    # - sh ./.gitlab/create-fit-dotenv.sh fit
    - npm run build
  artifacts:
    paths:
      - .next
      - dist
