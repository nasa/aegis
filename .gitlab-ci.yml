stages:
  - stageless

default:
  timeout: 10 minutes
  # Default node image unless a job specifies its own.
  # Declared here rather than in run-on-commits.gitlab-ci.yml so it applies to
  # scheduled pipelines too (they do not include that file).
  image: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:26.13.0-alpine"

variables:
  HOME: "/tmp" # required for openshift for now

.npm-toolchain:
  before_script:
    # OpenShift jobs run as a random non-root UID.
    - export NPM_CONFIG_PREFIX=/tmp/npm-global
    - export PATH="${NPM_CONFIG_PREFIX}/bin:${PATH}"
    - npm install --global npm@12.2.1
    - hash -r
    - node --version
    - npm --version

# These includes do not define the order of the pipeline. That is determined by
# the `needs` value for each job
include:
  # Jobs that run on commits and scheduled pipelines.
  #
  # Scheduled pipelines are used to do regular reporting on things like vulnerabilities and test
  # coverage. We don't want them to build packages and Docker images or do deploys
  - local: .gitlab/run-on-schedule.gitlab-ci.yml
    rules:
      - if: $CI_PIPELINE_SOURCE == "schedule"

  # Jobs that run on commits only, not scheduled pipelines
  - local: .gitlab/run-on-commits.gitlab-ci.yml
    rules:
      - if: $CI_PIPELINE_SOURCE != "schedule"

  # Other jobs that we need for both types of pipelines
  - local: .gitlab/includes/db-import.yml
    rules:
      - if: $SCHEDULE_TYPE != "audit" # exclude from audit scheduled pipelines
  - local: .gitlab/includes/build-support.yml
    rules:
      - if: $SCHEDULE_TYPE != "audit" # exclude from audit scheduled pipelines
  - project: "emss/gitlab-templates"
    ref: 2.10.0
    file:
      # EMSS shared dev server helpers (carbon, iron, oxygen, etc)
      - "/jobs/emss-shared-dev.gitlab-ci.yml"
