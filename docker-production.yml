version: "3"
services:
  node:
    command: bash -c "npm install && npm run build && npm run start"
    restart: always
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
  postgis:
    restart: always
    environment:
      POSTGRES_USER: ${AEGIS_DB_USER}
      POSTGRES_PASSWORD: ${AEGIS_DB_PASS}
      POSTGRES_DB: ${AEGIS_DB_NAME}
    volumes:
      - ./:/app
      - ./.docker/mmgis.sql:/docker-entrypoint-initdb.d/mmgis.sql
    networks:
      - aegis-network

#Docker Networks
networks:
  aegis-network:
    driver: bridge