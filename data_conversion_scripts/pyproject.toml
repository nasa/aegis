[project]
name = "aegis-data-conversion"
version = "0.1.0"
description = "Data conversion utilities for AEGIS — extract ArcGIS bundles, build COGs, generate tile pyramids."
requires-python = ">=3.10"
# NOTE: The geospatial stack (rasterio, fiona, pyproj, gdal) is intentionally
# NOT listed here. Those packages build from source on PyPI and require a system
# libgdal/gdal-config, which fails on a clean machine (the exact `fiona` build
# error this project hit). They are provided instead as conda-forge *binaries*
# via [tool.pixi.dependencies] below. For pure `uv` users, install them with
#   uv run --with rasterio --with fiona --with pyproj python <script>.py
# (uv pulls prebuilt wheels for these on most platforms), or just use pixi.
dependencies = [
    "pmtiles>=3.2.0",
    "mapbox-vector-tile>=2.2.0",
    "pillow>=12.2.0",
]

# NOTE: the pipeline scripts are run by path (e.g.
#   pixi run python esri-to-aegis-lunar-southpole/main.py ...
# ) and orchestrate their sub-scripts via subprocess, so there are no console-script
# entry points and nothing is imported as a dotted package. The editable self-install
# below exists only to pull the pure-Python PyPI deps via pixi.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# Nothing here is an importable package — the pipeline lives in the hyphenated
# directory `esri-to-aegis-lunar-southpole/` and is executed by path. Install no
# Python modules/packages; the editable install only brings in [project.dependencies].
[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = []

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

# Geospatial stack as conda-forge BINARIES (prebuilt libgdal + the gdal2tiles /
# gdalbuildvrt / gdalwarp / gdaldem CLIs, plus the rasterio/fiona/pyproj Python
# bindings). This is the whole point of using pixi here: no source builds, no
# system GDAL, no gdal-config. Adding fiona/rasterio via --pypi instead would
# try to build from source and fail with "A GDAL API version must be specified".
[tool.pixi.dependencies]
gdal = "*"
rasterio = ">=1.4.4"
fiona = ">=1.9.6"
pyproj = ">=3.6.0"

# Pure-Python deps (no native build) stay on PyPI. The editable self-install
# brings in the [project].dependencies (pmtiles, mapbox-vector-tile) only.
#
# lgrs (the USGS/SETI Lunar Grid Reference System generator) + geopandas are
# pure-Python wheels — they bind to the conda-forge shapely/pyproj/fiona binaries
# already provided above, so they belong here (NOT in [project.dependencies], which
# would force from-source builds). lgrs needs Python >=3.13; the pixi env resolves
# 3.14, so no separate interpreter is required. Used by grid/generate_lgrs.py to
# generate the LGRS grid (replacing the manual ESRI/ArcGIS export step). We do NOT
# install lgrs's optional [reference] extra, which would pull a source-built gdal.
[tool.pixi.pypi-dependencies]
aegis-data-conversion = { path = ".", editable = true }
lgrs = ">=0.3.0"
geopandas = "*"

[tool.pixi.tasks]
