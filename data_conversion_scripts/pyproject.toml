[project]
name = "aegis-data-conversion"
version = "0.1.0"
description = "Data conversion utilities for AEGIS — extract ArcGIS bundles, build COGs, generate tile pyramids."
requires-python = ">=3.10"
dependencies = [
    "rasterio>=1.4.4",
    "pmtiles>=3.2.0",
    "mapbox-vector-tile>=2.2.0",
]

[project.scripts]
aegis-arcgis-to-pmtiles = "arcgis_compact_cache_v2_to_pmtiles:main"
aegis-geotiff-to-cog = "geotiff_to_cog:main"
aegis-inspect-geotiff = "inspect_geotiff:main"
aegis-raster-to-tiles = "raster_to_tiles:main"
